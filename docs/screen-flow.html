<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#F6F5F1;font-family:Inter,Helvetica,Arial,sans-serif}
</style></head><body>
<svg id="d" width="1200" height="650" viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F3E8F"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker>
<style>
.box{fill:#fff;stroke:#2F3E8F;stroke-width:2}
.home{fill:#2F3E8F}
.t{font-size:17px;font-weight:700;fill:#1E2333;text-anchor:middle}
.ht{fill:#fff}
.s{font-size:12.5px;fill:#5E6478;text-anchor:middle}
.hs{fill:#E7EAF8}
.l{font-size:12.5px;fill:#2F3E8F;font-weight:600}
.lr{font-size:12.5px;fill:#B3261E;font-weight:600}
.e{stroke:#2F3E8F;stroke-width:2;fill:none;marker-end:url(#a)}
.er{stroke:#B3261E;stroke-width:2;fill:none;marker-end:url(#r);stroke-dasharray:6 4}
</style></defs>
<text x="40" y="44" font-size="24" font-weight="800" fill="#1F2A66">StudyDeck · screen flow</text>
<text x="40" y="68" font-size="14" fill="#5E6478">7 screens · Expo Router Stack · solid = push / back, dashed red = replace (history cleared)</text>

<!-- nodes -->
<rect class="box" x="40" y="120" width="180" height="70" rx="14"/><text class="t" x="130" y="152">1 · Welcome</text><text class="s" x="130" y="172">/ (index)</text>
<rect class="box" x="40" y="300" width="180" height="70" rx="14"/><text class="t" x="130" y="332">2 · Login</text><text class="s" x="130" y="352">/login · Zod + mock check</text>
<rect class="home" x="370" y="290" width="220" height="90" rx="14"/><text class="t ht" x="480" y="326">3 · My Coursework</text><text class="s hs" x="480" y="347">/coursework · search, filter</text><text class="s hs" x="480" y="364">status counts</text>
<rect class="box" x="720" y="120" width="190" height="70" rx="14"/><text class="t" x="815" y="152">4 · Details</text><text class="s" x="815" y="172">/details/[id] · days left</text>
<rect class="box" x="1000" y="120" width="170" height="70" rx="14"/><text class="t" x="1085" y="152">6 · Edit item</text><text class="s" x="1085" y="172">/edit/[id] · pre-filled</text>
<rect class="box" x="720" y="300" width="190" height="70" rx="14"/><text class="t" x="815" y="332">5 · Add item</text><text class="s" x="815" y="352">/add · Zod form</text>
<rect class="box" x="720" y="480" width="190" height="70" rx="14"/><text class="t" x="815" y="512">7 · Profile</text><text class="s" x="815" y="532">/profile · stats, Log out</text>
<rect x="720" y="215" width="190" height="34" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.5"/><text x="815" y="237" font-size="13" fill="#B3261E" text-anchor="middle" font-weight="700">Delete confirmation dialog</text>
<path d="M815,190 L815,215" stroke="#B3261E" stroke-width="1.5" stroke-dasharray="3 3"/>

<!-- edges -->
<path class="er" d="M130,190 L130,296"/><text class="lr" x="140" y="248">Get started (replace)</text>
<path class="er" d="M220,335 L366,335"/><text class="lr" x="228" y="325">valid login (replace)</text>

<path class="e" d="M440,290 L440,155 L716,155"/><text class="l" x="452" y="147">tap a card</text>
<path class="e" d="M720,232 L540,232 L540,286"/><text class="l" x="552" y="224">Delete (confirmed) → back</text>
<path class="e" d="M590,322 L716,322"/><text class="l" x="600" y="314">+ Add coursework</text>
<path class="e" d="M720,352 L594,352"/><text class="l" x="600" y="370">Save / Cancel → back</text>
<path class="e" d="M440,380 L440,515 L716,515"/><text class="l" x="452" y="507">profile icon</text>

<path class="e" d="M910,145 L996,145"/><text class="l" x="940" y="137">Edit</text>
<path class="e" d="M1000,170 L914,170"/><text class="l" x="918" y="210">Save / Cancel → back</text>

<path class="er" d="M720,540 C500,610 160,600 130,374"/><text class="lr" x="300" y="604">Log out: dismissAll + replace("/login")</text>

<text x="40" y="630" font-size="12.5" fill="#5E6478">Screens 3–7 are inside Stack.Protected (only after login). Back from Details / Add / Profile returns to My Coursework; Back from Edit returns to Details.</text>
</svg></body></html>
